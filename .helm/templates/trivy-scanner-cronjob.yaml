{{- if .Values.trivyScanner.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-trivy-scanner
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-trivy-scanner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/component: trivy-scanner
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: {{ .Values.trivyScanner.schedule | quote }}
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.trivyScanner.activeDeadlineSeconds | default 14400 }}
      ttlSecondsAfterFinished: 3600
      parallelism: {{ .Values.trivyScanner.parallelism | default 3 }}
      completions: {{ .Values.trivyScanner.parallelism | default 3 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}-trivy-scanner
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: trivy-scanner
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          hostNetwork: false
          hostPID: false
          hostIPC: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trivy-scanner
              image: "{{ .Values.trivyScanner.image.repository }}:{{ .Values.trivyScanner.image.tag | default "latest" }}"
              imagePullPolicy: {{ .Values.trivyScanner.image.pullPolicy }}
              command: ["/usr/local/bin/trivy-scanner"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              env:
                - name: SPAM_API_URL
                  value: "http://{{ .Release.Name }}-worker:{{ .Values.runner.httpPort | default 8081 }}"
                - name: RUNNER_HMAC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-runner
                      key: RUNNER_HMAC_KEY
                - name: TRIVY_CACHE_DIR
                  value: /trivy-cache
                - name: TMPDIR
                  value: /tmp
              volumeMounts:
                - name: trivy-cache
                  mountPath: /trivy-cache
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/runner
              {{- with .Values.trivyScanner.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: trivy-cache
              emptyDir: {}
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: home
              emptyDir:
                medium: Memory
                sizeLimit: 10Mi
{{- end }}
