{{- if .Values.imageScanner.enabled }}
# This CronJob is the pod-template source for the scanner operator. The
# schedule itself is suspended — the worker's scanner-operator loop is
# the single authority deciding when pods spawn, cloning this template
# with parallelism=1 per Job. Keeping the CronJob (vs a ConfigMap for
# the template) lets operators edit via Helm values and keeps RBAC
# consistent with other Job-cloning paths.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-image-scanner
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-image-scanner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/component: image-scanner
    app.kubernetes.io/managed-by: Helm
spec:
  # "@yearly" is a no-op placeholder — Kubernetes requires a valid cron
  # expression but we never want it to fire. suspend: true is the
  # actual guard.
  schedule: "@yearly"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.imageScanner.activeDeadlineSeconds | default 10800 }}
      ttlSecondsAfterFinished: 600
      # parallelism/completions are overridden to 1/1 when the operator
      # clones this template — the operator does scale-out by spawning
      # N Jobs, not one Job with N pods, so individual pod scheduling
      # failures are observable.
      parallelism: 1
      completions: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}-image-scanner
            app.kubernetes.io/instance: {{ .Release.Name }}
            # Distinct component label so the sbom-scanner NetworkPolicy
            # (which matches component=scanner) does not also apply here.
            # The image-scanner NetworkPolicy matches this label exactly.
            app.kubernetes.io/component: image-scanner
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          hostNetwork: false
          hostPID: false
          hostIPC: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: image-scanner
              image: "{{ .Values.imageScanner.image.repository }}:{{ .Values.imageScanner.image.tag | default "latest" }}"
              imagePullPolicy: {{ .Values.imageScanner.image.pullPolicy }}
              command: ["/usr/local/bin/image-scanner"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              env:
                - name: SPAM_API_URL
                  value: "http://{{ .Release.Name }}-worker:{{ .Values.runner.httpPort | default 8081 }}"
                - name: RUNNER_HMAC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-runner
                      key: RUNNER_HMAC_KEY
                - name: WORK_DIR
                  value: /work
                - name: GRYPE_DB_CACHE_DIR
                  value: /grype-cache
                - name: TRIVY_CACHE_DIR
                  value: /trivy-cache
                - name: SCAN_DEADLINE_SECONDS
                  value: {{ .Values.imageScanner.scanDeadlineSeconds | default 900 | quote }}
                {{- with .Values.imageScanner.operator }}
                # Linger behaviour: pods keep polling an empty queue for this
                # long before exiting, so short bursts amortise the grype DB
                # download instead of paying it per digest.
                - name: SCANNER_LINGER_IDLE_MAX
                  value: {{ .lingerIdleMax | default "30m" | quote }}
                - name: SCANNER_POLL_INTERVAL
                  value: {{ .pollInterval | default "15s" | quote }}
                {{- end }}
                - name: TMPDIR
                  value: /tmp
                {{- range $key, $value := .Values.imageScanner.extraEnv }}
                - name: {{ $key | quote }}
                  value: {{ $value | quote }}
                {{- end }}
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: grype-cache
                  mountPath: /grype-cache
                - name: trivy-cache
                  mountPath: /trivy-cache
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/scanner
              {{- with .Values.imageScanner.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            # Scratch space for the extracted image rootfs (filesystem
            # scanners like betterleaks/trivy need real filesystem, not
            # tmpfs — layers can be hundreds of MB).
            - name: work
              emptyDir: {}
            - name: grype-cache
              emptyDir: {}
            - name: trivy-cache
              emptyDir: {}
            # /tmp is disk-backed (not tmpfs) so image-layer extraction can
            # exceed pod memory without OOMing. sizeLimit caps node
            # ephemeral-storage use per pod. See imageScanner.tmpSizeLimit.
            - name: tmp
              emptyDir:
                sizeLimit: {{ .Values.imageScanner.tmpSizeLimit | default "8Gi" }}
            - name: home
              emptyDir:
                medium: Memory
                sizeLimit: 10Mi
{{- end }}
