{{- if and .Values.providerSecrets.enabled (not .Values.providerSecrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-provider-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: providers
    app.kubernetes.io/managed-by: "Helm"
  {{- with .Values.providerSecrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.providerSecrets.immutable }}
immutable: true
{{- end }}
type: Opaque
data:
  {{- $secretName := printf "%s-provider-secrets" .Release.Name }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if .Values.providerSecrets.key }}
  PROVIDER_SECRETS_KEY: {{ .Values.providerSecrets.key | b64enc | quote }}
  {{- else if and $existing (index $existing.data "PROVIDER_SECRETS_KEY") }}
  PROVIDER_SECRETS_KEY: {{ index $existing.data "PROVIDER_SECRETS_KEY" | quote }}
  {{- else }}
  PROVIDER_SECRETS_KEY: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
