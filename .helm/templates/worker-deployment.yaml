{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ default .Release.Name .Values.name }}-worker
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: "Helm"
spec:
  replicas: {{ .Values.worker.replicaCount | default 1 }}
  {{- with .Values.worker.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion }}
        app.kubernetes.io/component: worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.runner.enabled }}
      serviceAccountName: {{ .Release.Name }}-worker
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-worker
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/worker"]
          {{- if .Values.runner.enabled }}
          ports:
            - name: runner-http
              containerPort: {{ .Values.runner.httpPort | default 8081 }}
              protocol: TCP
          {{- with .Values.worker.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.appSecret.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.appSecret.existingSecret | default (printf "%s-app-secret" .Release.Name) }}
          {{- end }}
          env:
            {{- with .Values.environments }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if or .Values.providerSecrets.enabled .Values.providerSecrets.existingSecret }}
            - name: PROVIDER_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.existingSecret | default (printf "%s-provider-secrets" .Release.Name) }}
                  key: PROVIDER_SECRETS_KEY
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_HOST
              value: "{{ .Release.Name }}-postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: POSTGRES_SSLMODE
              value: {{ .Values.postgresqlConnection.sslmode | quote }}
            {{- else if .Values.postgresqlConnection.host }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgresqlConnection.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgresqlConnection.port | quote }}
            - name: POSTGRES_SSLMODE
              value: {{ .Values.postgresqlConnection.sslmode | quote }}
            {{- end }}
            # Tracking metadata so dynamically-created run/scanner Jobs
            # carry ArgoCD + helm labels and appear as part of this
            # Application instead of as orphans. Read by the Go config
            # and stamped onto every Job the worker spawns.
            - name: SPAM_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: SPAM_CHART_NAME
              value: "{{ .Chart.Name }}-{{ .Chart.Version }}"
            {{- with .Values.worker.concurrency }}
            - name: WORKER_CONCURRENCY
              value: {{ .main | default 4 | quote }}
            - name: WORKER_VULN_META_CONCURRENCY
              value: {{ .vulnMeta | default 8 | quote }}
            {{- end }}
            {{- if .Values.sbomScanner.enabled }}
            - name: SBOM_SCANNER_CRONJOB_NAME
              value: "{{ .Release.Name }}-sbom-scanner"
            {{- end }}
            {{- if .Values.imageScanner.enabled }}
            - name: IMAGE_SCAN_ENABLED
              value: "true"
            # The scanner-operator loop in the worker clones this CronJob's
            # pod template to spawn scanner pods on demand. The CronJob
            # itself is suspended — schedule exists only to satisfy k8s.
            - name: IMAGE_SCAN_CRONJOB_NAME
              value: "{{ .Release.Name }}-image-scanner"
            {{- with .Values.imageScanner.operator }}
            - name: IMAGE_SCAN_MAX_PARALLELISM
              value: {{ .maxParallelism | default 2 | quote }}
            - name: IMAGE_SCAN_SPAWN_SPACING_SECONDS
              value: {{ .spawnSpacingSeconds | default 2 | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.runner.enabled }}
            - name: RUNNER_ENABLED
              value: "true"
            - name: RUNNER_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-runner
                  key: RUNNER_HMAC_KEY
            - name: RUNNER_IMAGE
              value: "{{ .Values.runner.image.repository }}:{{ .Values.runner.image.tag }}"
            - name: RUNNER_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: RUNNER_SERVICE_ACCOUNT
              value: {{ .Values.runner.serviceAccount.name | default (printf "%s-runner" .Release.Name) | quote }}
            - name: RUNNER_WORKER_URL
              value: "http://{{ .Release.Name }}-worker:{{ .Values.runner.httpPort | default 8081 }}"
            - name: RUNNER_HTTP_PORT
              value: {{ .Values.runner.httpPort | default 8081 | quote }}
            - name: RUNNER_TTL_SECONDS
              value: {{ .Values.runner.ttlSecondsAfterFinished | default 3600 | quote }}
            - name: RUNNER_ACTIVE_DEADLINE
              value: {{ .Values.runner.activeDeadlineSeconds | default 1800 | quote }}
            - name: RUNNER_EGRESS_SELF_TEST_ENABLED
              value: {{ .Values.runner.egressSelfTest.enabled | quote }}
            - name: RUNNER_EGRESS_SELF_TEST_URL
              value: {{ .Values.runner.egressSelfTest.url | default "https://example.com" | quote }}
            - name: RUNNER_EGRESS_SELF_TEST_TIMEOUT_SECONDS
              value: {{ .Values.runner.egressSelfTest.timeoutSeconds | default 5 | quote }}
            {{- if .Values.runner.podAnnotations }}
            - name: RUNNER_POD_ANNOTATIONS
              value: {{ include "spam.runnerPodAnnotations" . | quote }}
            {{- end }}
            # Downward API: inject pod metadata for annotation inheritance
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
