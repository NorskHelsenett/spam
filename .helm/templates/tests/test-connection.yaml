apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "helm.fullname" . }}-test-connection"
  labels:
    {{- include "helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command: ["/bin/sh", "-ec"]
      args:
        - wget -qO- --timeout=5 {{ include "helm.fullname" . }}:{{ .Values.service.port }} >/dev/null
  restartPolicy: Never
