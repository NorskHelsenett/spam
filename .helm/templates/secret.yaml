{{- if and .Values.appSecret.enabled (not .Values.appSecret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
    app.kubernetes.io/managed-by: "Helm"
type: Opaque
data:
  {{- $secretName := printf "%s-app" .Release.Name }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  
  {{- /* OIDC Configuration */ -}}
  {{- if .Values.appSecret.oidc.issuerUrl }}
  OIDC_ISSUER_URL: {{ .Values.appSecret.oidc.issuerUrl | b64enc | quote }}
  {{- else }}
  OIDC_ISSUER_URL: {{ "" | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.appSecret.oidc.clientId }}
  OIDC_CLIENT_ID: {{ .Values.appSecret.oidc.clientId | b64enc | quote }}
  {{- else }}
  OIDC_CLIENT_ID: {{ "" | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.appSecret.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.appSecret.oidc.clientSecret | b64enc | quote }}
  {{- else }}
  OIDC_CLIENT_SECRET: {{ "" | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.appSecret.oidc.redirectUrl }}
  OIDC_REDIRECT_URL: {{ .Values.appSecret.oidc.redirectUrl | b64enc | quote }}
  {{- else }}
  OIDC_REDIRECT_URL: {{ "" | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.appSecret.oidc.scopes }}
  OIDC_SCOPES: {{ .Values.appSecret.oidc.scopes | b64enc | quote }}
  {{- else }}
  OIDC_SCOPES: {{ "openid profile email" | b64enc | quote }}
  {{- end }}
  
  {{- /* Session Cookie Keys - Auto-generate if not provided */ -}}
  {{- if .Values.appSecret.session.cookieHashKey }}
  SESSION_COOKIE_HASH_KEY: {{ .Values.appSecret.session.cookieHashKey | b64enc | quote }}
  {{- else if and $existing (index $existing.data "SESSION_COOKIE_HASH_KEY") }}
  SESSION_COOKIE_HASH_KEY: {{ index $existing.data "SESSION_COOKIE_HASH_KEY" | quote }}
  {{- else }}
  SESSION_COOKIE_HASH_KEY: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.appSecret.session.cookieBlockKey }}
  SESSION_COOKIE_BLOCK_KEY: {{ .Values.appSecret.session.cookieBlockKey | b64enc | quote }}
  {{- else if and $existing (index $existing.data "SESSION_COOKIE_BLOCK_KEY") }}
  SESSION_COOKIE_BLOCK_KEY: {{ index $existing.data "SESSION_COOKIE_BLOCK_KEY" | quote }}
  {{- else }}
  SESSION_COOKIE_BLOCK_KEY: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
---
{{- end }}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: "Helm"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.postgresql.auth.password }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.postgresql.auth.postgresPassword }}
  postgres-password: {{ .Values.postgresql.auth.postgresPassword | b64enc | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
