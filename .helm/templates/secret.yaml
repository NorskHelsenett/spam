{{- if .Values.postgresql.enabled }}
{{- if not .Values.postgresql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: "Helm"
type: Opaque
data:
  {{- if .Values.postgresql.auth.password }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.postgresql.auth.postgresPassword }}
  postgres-password: {{ .Values.postgresql.auth.postgresPassword | b64enc | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}

{{- if .Values.appSecret.enabled }}
{{- if not .Values.appSecret.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
    app.kubernetes.io/managed-by: "Helm"
type: Opaque
data:
  {{- $secretName := printf "%s-app" .Release.Name }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- range $key, $value := .Values.appSecret.data }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- else if and $existing (index $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
