{{- if .Values.runner.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-repo-runner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/component: repo-runner
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/resource-policy: keep
  {{- with .Values.runner.secretAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.runner.secretImmutable }}
immutable: true
{{- end }}
type: Opaque
data:
  {{- $secretName := printf "%s-runner" .Release.Name }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if .Values.runner.hmacKey }}
  RUNNER_HMAC_KEY: {{ .Values.runner.hmacKey | b64enc | quote }}
  {{- else if and $existing (index $existing.data "RUNNER_HMAC_KEY") }}
  RUNNER_HMAC_KEY: {{ index $existing.data "RUNNER_HMAC_KEY" | quote }}
  {{- else }}
  RUNNER_HMAC_KEY: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
