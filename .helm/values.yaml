# Default values for golang.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of replicas for the deployment
# For production with load balancing, increase to 2+ for high availability
replicaCount: 1

# Deployment strategy
# RollingUpdate ensures zero-downtime deployments
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1        # Maximum number of pods that can be created above desired count
    maxUnavailable: 0  # Maximum number of pods that can be unavailable during update

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: git.torden.tech/jonasbg/spam
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Additional environment variables for the application
# These override defaults; most required vars come from appSecret
environments: []
  # Optional environment variables (all have defaults):
  # - name: "HTTP_PORT"
  #   value: "8080"
  # - name: "SESSION_TTL"
  #   value: "8h"
  # - name: "COOKIE_SECURE"
  #   value: "true"
  # - name: "SESSION_COOKIE_NAME"
  #   value: "spam_session"
  # - name: "AUTH_STATE_COOKIE_NAME"
  #   value: "spam_oidc"

# Application secrets configuration (OIDC and session keys)
# These secrets are required for the application to run
appSecret:
  # Set to true to create the secret automatically
  enabled: false
  
  # Use an existing secret instead of creating one (optional)
  # If set, the chart will NOT create a new secret and will use the specified one
  existingSecret: ""  # e.g., "spam-app-secret"
  
  # OIDC Configuration (required for authentication)
  oidc:
    issuerUrl: ""      # OIDC provider URL (e.g., "https://auth.example.com")
    clientId: ""       # OIDC client ID
    clientSecret: ""   # OIDC client secret
    redirectUrl: ""    # Callback URL (e.g., "https://spam.example.com/api/auth/callback")
    scopes: "openid profile email"  # OAuth scopes
  
  # Session cookie keys (auto-generated if empty)
  # These are base64-encoded random keys for securing session cookies
  session:
    cookieHashKey: ""   # HMAC key for cookie signing (≥32 bytes, auto-generated)
    cookieBlockKey: ""  # AES key for cookie encryption (16/24/32 bytes, auto-generated)

# To manually create the secret, use:
#   kubectl create secret generic spam-app-secret \
#     --from-literal=OIDC_ISSUER_URL='https://auth.example.com' \
#     --from-literal=OIDC_CLIENT_ID='your-client-id' \
#     --from-literal=OIDC_CLIENT_SECRET='your-client-secret' \
#     --from-literal=OIDC_REDIRECT_URL='https://spam.example.com/api/auth/callback' \
#     --from-literal=OIDC_SCOPES='openid profile email' \
#     --from-literal=SESSION_COOKIE_HASH_KEY='$(openssl rand -base64 32)' \
#     --from-literal=SESSION_COOKIE_BLOCK_KEY='$(openssl rand -base64 32)' \
#     --namespace spam
# Then set appSecret.existingSecret="spam-app-secret" above

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  enabled: true
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

healthPort: 8081

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - name: chart-example.local
      tls: false
      paths:
        - path: /
          pathType: ImplementationSpecific

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: health
readinessProbe:
  httpGet:
    path: /healthz
    port: health

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# PostgreSQL configuration
# Set enabled: true to deploy PostgreSQL alongside your application
postgresql:
  enabled: false  # Set to true to enable PostgreSQL deployment

  # PostgreSQL image configuration
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent

  # Authentication configuration
  auth:
    username: spam
    database: spam
    password: ""  # Leave empty to auto-generate a strong password
    postgresPassword: ""  # Leave empty to auto-generate postgres admin password

  # Primary instance configuration
  primary:
    # Persistent volume configuration
    persistence:
      enabled: true
      size: 8Gi
      accessModes:
        - ReadWriteOnce
      # storageClass: ""  # Use default storage class or specify one (e.g., "local-path", "gp2")

    # Resource limits and requests
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m

# Connection configuration for the application
# When postgresql.enabled=true, these are auto-configured
# When using external PostgreSQL, set these values
postgresqlConnection:
  # host is auto-set to "{{ .Release.Name }}-postgresql" when postgresql.enabled=true
  host: ""
  port: 5432
  sslmode: disable
