# Default values for golang.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of replicas for the deployment
# For production with load balancing, increase to 2+ for high availability
replicaCount: 1

# Deployment strategy
# RollingUpdate ensures zero-downtime deployments
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1        # Maximum number of pods that can be created above desired count
    maxUnavailable: 0  # Maximum number of pods that can be unavailable during update

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: git.torden.tech/jonasbg/spam
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Set to true to enable initContainer for downloading agent artifacts
# Requires AGENT_VERSION and AGENT_RELEASE_BASE_URL to be set in environments
enableArtifactDownload: false  

environments:
  - name: "AGENT_ARTIFACT_DIR"
    value: "/var/opt/agents"
  - name: "DB_DIR"
    value: "/data"
  # Agent release configuration: choose one of three modes:
  # Mode 1 (Recommended): Auto-fetch latest release
  - name: "AGENT_RELEASE_REPO_URL"
    value: "https://git.torden.tech/jonasbg/spam"  # Auto-discovers latest release
  - name: "AGENT_RELEASE_CACHE_TTL"
    value: "5m"  # How often to check for new releases (e.g., 5m, 1h, 30m)
  # Mode 2 (Pinned): Pin to specific version with auto-constructed download URL
  # Uncomment AGENT_VERSION to pin to a specific release while keeping AGENT_RELEASE_REPO_URL
  # - name: "AGENT_VERSION"
  #   value: "v0.12.0"  # With AGENT_RELEASE_REPO_URL set, this pins to a specific version
  # Mode 3 (Manual): Explicitly set both version and download URL (comment out AGENT_RELEASE_REPO_URL)
  # - name: "AGENT_VERSION"
  #   value: "v0.12.1"
  # - name: "AGENT_RELEASE_BASE_URL"
  #   value: "https://git.torden.tech/jonasbg/spam/releases/download/v0.12.1/"
  - name: "METRICS_RETENTION_DAYS"
    value: "30"  # Days to retain metrics data (0=default 365, negative=forever)
  - name: "VAPID_SUBSCRIBER"
    value: "mailto:admin@example.com"  # Email or URL for VAPID identification (required for Safari/APNs push notifications)

# Application secret configuration
# Provide app secrets here; values can be explicit or auto-generated when empty
appSecret:
  enabled: true
  existingSecret: ""  # Use an existing secret instead of creating one
  data:
    AGENT_SESSION_HMAC_KEY: ""  # Leave empty to auto-generate a random key

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  enabled: true
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

healthPort: 8081

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - name: chart-example.local
      tls: false
      paths:
        - path: /
          pathType: ImplementationSpecific

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: health
readinessProbe:
  httpGet:
    path: /healthz
    port: health

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# PostgreSQL configuration
# Set enabled: true to deploy PostgreSQL alongside your application
postgresql:
  enabled: false  # Set to true to enable PostgreSQL deployment

  # PostgreSQL image configuration
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent

  # Authentication configuration
  auth:
    username: spam
    password: ""  # Leave empty to auto-generate a strong password
    database: spam
    postgresPassword: ""  # Leave empty to auto-generate postgres user password

    # Optional: Use existing secret for credentials (recommended for production)
    # If set, the chart will NOT create a new secret and will use the specified one instead
    # This prevents overwriting existing secrets in the cluster
    existingSecret: ""  # e.g., "spam-postgresql" to use your existing secret

    # Secret key names (only used when existingSecret is set)
    # These define which keys in the existing secret contain the passwords
    secretKeys:
      userPasswordKey: password           # Key containing the user password
      adminPasswordKey: postgres-password  # Key containing the postgres admin password

  # Primary instance configuration
  primary:
    # Persistent volume configuration
    persistence:
      enabled: true
      size: 8Gi
      accessModes:
        - ReadWriteOnce
      # storageClass: ""  # Use default storage class or specify one (e.g., "local-path", "gp2")

    # Resource limits and requests
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m

# Connection configuration for the application
# When postgresql.enabled=true, these are auto-configured
# When using external PostgreSQL, set these values
postgresqlConnection:
  # host is auto-set to "{{ .Release.Name }}-postgresql" when postgresql.enabled=true
  host: ""
  port: 5432
  sslmode: disable
