# Default values for golang.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of replicas for the deployment
# For production with load balancing, increase to 2+ for high availability
replicaCount: 1

# Deployment strategy — zero-downtime rollouts.
# maxUnavailable: 0 means we never drop below replicaCount during an
# upgrade. maxSurge: 1 lets one extra pod come up and pass readiness
# before the old pod is drained, so at least one replica is always
# serving traffic across a restart. Pair with pdb below to get the
# same guarantee for voluntary disruptions (node drains, evictions).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# PodDisruptionBudget — keep at least one api pod serving during
# voluntary disruptions (node drain, autoscaler eviction). The Deployment
# strategy above handles rollouts; this handles everything else. With
# replicaCount: 1 and minAvailable: 1 a drain will BLOCK until you first
# bump replicas or delete the PDB — that's the point, it prevents
# accidental takedowns of a single-replica deployment.
pdb:
  enabled: true
  minAvailable: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: git.torden.tech/jonasbg/spam
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Additional environment variables for the application
# These override defaults; most required vars come from appSecret
environments: []
  # Optional environment variables (all have defaults):
  # - name: "HTTP_PORT"
  #   value: "8080"
  # - name: "SESSION_TTL"
  #   value: "8h"
  # - name: "COOKIE_SECURE"
  #   value: "true"
  # - name: "SESSION_COOKIE_NAME"
  #   value: "spam_session"
  # - name: "AUTH_STATE_COOKIE_NAME"
  #   value: "spam_oidc"

# Application secrets configuration (OIDC and session keys)
# These secrets are required for the application to run
appSecret:
  # Set to true to create the secret automatically
  enabled: false

  # Use an existing secret instead of creating one (optional)
  # If set, the chart will NOT create a new secret and will use the specified one
  existingSecret: ""  # e.g., "spam-app-secret"

  # Set to true to prevent secret updates (rotation requires new secret name)
  immutable: false

  # Optional annotations added to the app Secret (in addition to helm.sh/resource-policy: keep)
  annotations: {}

  # OIDC Configuration (required for authentication)
  oidc:
    issuerUrl: ""      # OIDC provider URL (e.g., "https://auth.example.com")
    clientId: ""       # OIDC client ID
    clientSecret: ""   # OIDC client secret
    redirectUrl: ""    # Callback URL (e.g., "https://spam.example.com/api/auth/callback")
    scopes: "openid profile email"  # OAuth scopes
  
  # Session cookie keys (auto-generated if empty)
  # These are base64-encoded random keys for securing session cookies
  session:
    cookieHashKey: ""   # HMAC key for cookie signing (≥32 bytes, auto-generated)
    cookieBlockKey: ""  # AES key for cookie encryption (16/24/32 bytes, auto-generated)

# Provider secrets key for encrypting PATs
providerSecrets:
  # Set to true to create the secret automatically
  enabled: false

  # Use an existing secret instead of creating one (optional)
  existingSecret: ""  # e.g., "spam-provider-secrets"

  # Set to true to prevent secret updates (rotation requires new secret name)
  immutable: true

  # Provide a specific key (optional). If empty, auto-generate and keep across upgrades.
  key: ""

  # Optional annotations added to the provider secrets Secret
  annotations: {}

# To manually create the secret, use:
#   kubectl create secret generic spam-app-secret \
#     --from-literal=OIDC_ISSUER_URL='https://auth.example.com' \
#     --from-literal=OIDC_CLIENT_ID='your-client-id' \
#     --from-literal=OIDC_CLIENT_SECRET='your-client-secret' \
#     --from-literal=OIDC_REDIRECT_URL='https://spam.example.com/api/auth/callback' \
#     --from-literal=OIDC_SCOPES='openid profile email' \
#     --from-literal=SESSION_COOKIE_HASH_KEY='$(openssl rand -base64 32)' \
#     --from-literal=SESSION_COOKIE_BLOCK_KEY='$(openssl rand -base64 32)' \
#     --namespace spam
# Then set appSecret.existingSecret="spam-app-secret" above

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  enabled: true
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - name: chart-example.local
      tls: false
      paths:
        - path: /
          pathType: ImplementationSpecific

# Arbitrary extra manifests rendered alongside the chart. Useful for
# Gateway API resources (HTTPRoute, ReferenceGrant), NetworkPolicies,
# CRs from other operators, etc., so an ArgoCD app that points at this
# chart can ship them as a single unit. Each entry is rendered as-is
# through `tpl`, so Go template expressions referencing chart values
# (e.g. `{{ .Release.Namespace }}`) are supported.
extraResources: []
  # - apiVersion: gateway.networking.k8s.io/v1
  #   kind: HTTPRoute
  #   metadata:
  #     name: spam
  #     namespace: {{ .Release.Namespace }}
  #   spec:
  #     parentRefs:
  #       - name: spam-gateway
  #         namespace: gateways
  #         sectionName: spam.sikkerhet.nhn.no
  #     hostnames:
  #       - spam.sikkerhet.nhn.no
  #     rules:
  #       - backendRefs:
  #           - kind: Service
  #             name: spam
  #             port: 8080

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# startupProbe gates liveness/readiness during boot — gives up to
# 60s (30 × 2s) for the server to bind before kubelet restarts the pod.
# startup/liveness use /api/healthz, which is process-only (no DB) — the
# server starts serving immediately, so these pass within seconds and a
# slow/busy DB can never trigger a restart. Readiness uses /api/readyz,
# which also checks that the base materialized views are populated;
# failing readiness only withholds traffic (no restart), so it can stay
# red for the minutes the background MV populate takes on a fresh deploy.
startupProbe:
  httpGet:
    path: /api/healthz
    port: http
  periodSeconds: 5
  failureThreshold: 12
livenessProbe:
  httpGet:
    path: /api/healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /api/readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# SSRF guardrails for the server-side host metadata / favicon fetcher
# used by the clusters page. Non-negotiable blocks (loopback,
# link-local, multicast, unspecified) are always enforced in code.
# blockCIDRs is an additional comma-separated list the operator can
# extend. Default: block 172.16/12 (often a corporate zone) while
# still letting the server reach 10/8 and 192.168/16 ingress hosts.
# Set to "" to allow all RFC1918 ranges.
hostmeta:
  blockCIDRs: "172.16.0.0/12"

# PostgreSQL configuration
# Set enabled: true to deploy PostgreSQL alongside your application
postgresql:
  enabled: false  # Set to true to enable PostgreSQL deployment

  # PostgreSQL image configuration
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent

  # Authentication configuration
  auth:
    # Use an existing secret instead of creating one (optional)
    # If set, the chart will NOT create a new secret and will use the specified one
    # Secret must contain keys: 'password' and 'postgres-password'
    existingSecret: ""  # e.g., "spam-postgresql-secret"

    # Set to true to prevent secret updates (rotation requires new secret name)
    immutable: false

    # Optional annotations added to the postgresql Secret (in addition to helm.sh/resource-policy: keep)
    annotations: {}

    username: spam
    database: spam
    password: ""  # Leave empty to auto-generate a strong password (ignored if existingSecret is set)
    postgresPassword: ""  # Leave empty to auto-generate postgres admin password (ignored if existingSecret is set)

# To manually create the PostgreSQL secret, use:
#   kubectl create secret generic spam-postgresql-secret \
#     --from-literal=password='$(openssl rand -base64 32)' \
#     --from-literal=postgres-password='$(openssl rand -base64 32)' \
#     --namespace spam
# Then set postgresql.auth.existingSecret="spam-postgresql-secret" above

  # Primary instance configuration
  primary:
    # Extra postgres command-line args. Used to enable
    # pg_stat_statements (powers the /admin/database slow-queries
    # view). Changing this list requires a postgres restart because
    # shared_preload_libraries is a postmaster-level setting.
    #
    # After the StatefulSet rolls with this enabled, an operator must
    # run once (as superuser) in the spam DB:
    #   CREATE EXTENSION pg_stat_statements;
    # The SPAM app user is not a superuser and cannot do this itself.
    extraArgs:
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=top"

    # Persistent volume configuration
    persistence:
      enabled: true
      size: 8Gi
      accessModes:
        - ReadWriteOnce
      # storageClass: ""  # Use default storage class or specify one (e.g., "local-path", "gp2")

    # Resource limits and requests
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    # Security context for PostgreSQL pod
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault

    # Security context for PostgreSQL container
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999

    # Pin the PostgreSQL pod to a specific node / nodepool. Kubernetes
    # scheduling matches node *labels* — annotations are not honored.
    # Verify the label exists with: kubectl get nodes --show-labels
    #
    # Simple label match:
    # nodeSelector:
    #   vitistack.io/nodepool: worker2
    nodeSelector: {}

    # nodeAffinity / podAffinity for soft preferences or multi-value
    # allowlists. Example — require one of two nodepools:
    # affinity:
    #   nodeAffinity:
    #     requiredDuringSchedulingIgnoredDuringExecution:
    #       nodeSelectorTerms:
    #         - matchExpressions:
    #             - key: vitistack.io/nodepool
    #               operator: In
    #               values: [worker2, worker3]
    affinity: {}

    # Tolerations — needed if the target node has taints (e.g. dedicated
    # database nodepools often do).
    # tolerations:
    #   - key: vitistack.io/nodepool
    #     operator: Equal
    #     value: worker2
    #     effect: NoSchedule
    tolerations: []


# Worker configuration
# The worker processes background jobs (SBOM parsing, etc.) and hosts
# the runner HTTP endpoints on port 8081 (job lease, results upload,
# complete). Two replicas give us zero-gap rollouts — without them, an
# in-flight runner upload can hit the worker Service IP during the
# brief window when the single pod is rolling and get a TCP timeout.
worker:
  enabled: true
  replicaCount: 2

  # Worker job-pool concurrency. Two independent goroutine pools run in
  # the same process: the main pool handles CREATE_RUN dispatch, feed
  # refreshes, sync jobs, etc.; the vuln-meta pool exclusively claims
  # VULN_META_FETCH so a large backfill (tens of thousands of jobs after
  # a fresh OSV scan) cannot FIFO-starve user-facing dispatches.
  # IMAGE_SCAN jobs are NOT served by either pool — they go to dedicated
  # scanner pods sized via imageScanner.operator.maxParallelism below.
  concurrency:
    main: 4
    vulnMeta: 8

  # Rolling strategy: keep serving throughout an upgrade.
  # maxUnavailable: 0 means we never go below the configured replica
  # count. maxSurge: 1 lets one extra pod come up before an old one
  # terminates — the new pod reaches readiness on /health before we
  # remove the old endpoint from the Service.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # PodDisruptionBudget — keep at least one worker serving during
  # voluntary disruptions (node drain, autoscaler evict). Off by
  # default for single-replica deploys where it would otherwise
  # block drains entirely.
  pdb:
    enabled: true
    minAvailable: 1

  # Readiness probe: only route Service traffic to pods whose
  # /health responds 200. Prevents half-booted replicas from
  # receiving runner uploads.
  readinessProbe:
    httpGet:
      path: /health
      port: runner-http
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  # Liveness: restart the pod if /health stops responding (worker
  # deadlocked or wedged on a poll). Looser threshold than readiness
  # so transient slowness doesn't cause unnecessary restarts.
  livenessProbe:
    httpGet:
      path: /health
      port: runner-http
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # Sized to move the pod out of BestEffort (on cpu, memory, and
  # especially ephemeral-storage). Without an ephemeral-storage request
  # the worker was first in the eviction queue when any neighbour filled
  # the node. The worker itself uses little disk — mostly the writable
  # rootfs + stdout logs — but 0 request meant 0 guarantee.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 2Gi

# Runner configuration
# repo-runner: clones a repo in a K8s Job and produces artifacts —
# syft-generated SBOM, betterleaks secret scan, dependency manifests.
# (sbom-scanner / image-scanner handle the vuln side; see their blocks.)
runner:
  enabled: false

  # repo-runner container image
  image:
    repository: spam-repo-runner
    tag: latest
    pullPolicy: IfNotPresent

  # HTTP port for runner callbacks (internal)
  httpPort: 8081

  # HMAC key for signing run tokens (auto-generated if empty)
  hmacKey: ""

  # Set to true to prevent secret updates (rotation requires new secret name)
  secretImmutable: false

  # Optional annotations added to the runner Secret
  secretAnnotations: {}

  # ServiceAccount for runner jobs
  serviceAccount:
    create: true
    name: ""  # Defaults to {{ .Release.Name }}-runner

  # Annotations to apply to runner pods
  # Runner jobs automatically inherit most annotations from the worker pod
  # Excludes: kubernetes.io/*, argocd tracking IDs, and other identity-specific annotations
  # ArgoCD will automatically discover runner jobs via labels without copied annotations
  # Additional annotations can be specified here if needed
  # Example:
  #   podAnnotations:
  #     custom-annotation: "value"
  podAnnotations: {}

  # Resource limits for runner jobs
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # Job lifecycle settings
  ttlSecondsAfterFinished: 3600  # TTL for completed jobs (1 hour)
  activeDeadlineSeconds: 1800   # Maximum runtime for jobs (30 minutes)

  # Fail the clone init container if it can still reach the public internet.
  # This is a defense-in-depth check that verifies the runner NetworkPolicy is
  # actually enforced at runtime.
  egressSelfTest:
    enabled: true
    url: "https://example.com"
    timeoutSeconds: 5

# SBOM scanner CronJob configuration
# Runs nightly and scans all SBOMs in the database for vulnerabilities.
# Uses a dedicated image (separate from the runner) with minimal attack surface.
# Named "sbom-scanner" because the tool inside is interchangeable — the input
# is always an SBOM, so the scanner's identity is the input shape, not the
# binary. Grype is the current producer.
sbomScanner:
  enabled: false
  schedule: "0 6 * * *"        # 6am nightly
  parallelism: 3               # Number of concurrent scanner pods
  activeDeadlineSeconds: 14400  # 4h max runtime

  # Dedicated sbom-scanner image (built from runner/Dockerfile.sbom-scanner).
  # Contains ONLY grype + the scanner binary — no git, syft, or betterleaks.
  image:
    repository: spam-sbom-scanner
    tag: ""
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Image scanner configuration
# Scans container-image digests with grype / syft / cosign / crane /
# betterleaks (trivy opt-in per category via the job payload). Pod
# lifecycle is driven by the worker's scanner-operator loop — the
# CronJob below serves only as a pod-template source and is suspended.
imageScanner:
  enabled: false
  activeDeadlineSeconds: 10800  # 3h hard cap per pod

  # Scanner operator — the worker-side controller that decides how many
  # scanner pods exist at any moment. See api/internal/imagescan/operator.go.
  operator:
    # Upper bound on concurrent scanner pods. The operator scales up to
    # this when the queue warrants; individual pods linger after draining
    # (see lingerIdleMax below) so short bursts amortise one DB download.
    maxParallelism: 2
    # Time the operator waits between creating individual pods on a
    # large backlog — rate-limits k8s API calls. Short is fine.
    spawnSpacingSeconds: 2
    # How long a scanner pod keeps polling an empty queue before it
    # exits (Go duration: 30m / 45m / 2h). Active scans reset the timer.
    # Longer = more DB-download amortisation, more idle resource; shorter
    # = faster resource release, more DB-download cost. 30m is a sane
    # middle for bursty arrival patterns.
    lingerIdleMax: 30m
    # Poll cadence while lingering on an empty queue.
    pollInterval: 15s

  # Dedicated image-scanner image (built from runner/Dockerfile.image-scanner).
  # Contains grype/syft/cosign/crane/betterleaks + trivy; no git.
  image:
    repository: spam-image-scanner
    tag: ""
    pullPolicy: IfNotPresent

  # Per-scan deadline enforced by the scanner binary itself (protects
  # against a single pathological image hanging the whole tick).
  scanDeadlineSeconds: 900

  # /tmp scratch volume. Subprocess temp (syft/grype image extraction)
  # is routed into a per-job dir under /work via TMPDIR, so /tmp only
  # holds incidental small files now. It used to be the extraction
  # target, where temp dirs orphaned by scan-deadline kills accumulated
  # across a lingering pod's scans until the kubelet evicted it for
  # exceeding this cap — per-job temp under /work is cleaned with the
  # job, so /tmp no longer needs multi-GB headroom.
  tmpSizeLimit: 1Gi

  # Per-volume caps on the other disk-backed emptyDirs. Each is counted
  # against node ephemeral storage, so bounding them (rather than leaving
  # {} = unbounded) is what stops a single scanner from filling the node
  # and triggering DiskPressure eviction of neighbouring pods.
  #
  #  work           — per-job scratch: syft/grype layer extraction (via
  #                   TMPDIR), exported rootfs, and artifacts. Scales
  #                   with image size; extraction can briefly hold both
  #                   the layer tarballs and the unpacked tree.
  #  grypeCache     — grype vulnerability DB (~1 GiB uncompressed)
  #  trivyCache     — trivy vulnerability DB (similar size)
  #
  # Sum of tmp + work + grype + trivy should fit inside the container's
  # ephemeral-storage limit below (see resources.limits.ephemeral-storage).
  workSizeLimit: 16Gi
  grypeCacheSizeLimit: 2Gi
  trivyCacheSizeLimit: 2Gi

  # Extra env forwarded to each scan subprocess. Typical keys:
  #   GRYPE_DB_UPDATE_URL, GRYPE_DB_AUTO_UPDATE, GRYPE_DB_VALIDATE_AGE
  #   TRIVY_DB_REPOSITORY, TRIVY_JAVA_DB_REPOSITORY
  # Leave empty to use upstream defaults (public CDN for grype / trivy DBs).
  extraEnv: {}

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
      # ephemeral-storage request is required to move the pod out of the
      # BestEffort eviction class for disk. Without it the scanner is
      # first in line when any neighbour fills the node. Size to cover
      # expected simultaneous use of the emptyDirs above.
      ephemeral-storage: 8Gi
    limits:
      cpu: "2"
      memory: 4Gi
      # Hard ceiling — if the pod exceeds this (sum of emptyDirs +
      # writable layer + logs) the kubelet evicts the pod rather than the
      # node. Matches the sum of tmp + work + grype + trivy caps above,
      # with a small buffer for logs and the writable layer.
      ephemeral-storage: 22Gi

# Connection configuration for the application
# When postgresql.enabled=true, these are auto-configured
# When using external PostgreSQL, set these values
postgresqlConnection:
  # host is auto-set to "{{ .Release.Name }}-postgresql" when postgresql.enabled=true
  host: ""
  port: 5432
  sslmode: disable

# Network Policy configuration
# Network policies are automatically applied when runner or sbomScanner is enabled.
# Restricts egress from runner and sbom-scanner pods to prevent data exfiltration.
# Pods can ONLY reach the worker service and DNS by default.
# All other outbound traffic (internet) is blocked unless explicitly allowed.
networkPolicy:
  runner:
    # Set to false to disable the runner network policy entirely.
    enabled: true
    # Additional egress rules for runner pods.
    # By default: DNS + worker API only. Public internet egress is blocked.
    additionalEgressRules: []

  sbomScanner:
    # Additional egress rules for sbom-scanner pods.
    # By default: DNS + worker API + HTTPS to public internet (for scanner
    # DB download from ghcr.io / anchore.io) are allowed. All RFC 1918
    # private ranges are blocked — the scanner cannot reach internal
    # cluster services.
    additionalEgressRules: []

  imageScanner:
    # Additional egress rules for image-scanner pods.
    # By default: DNS + worker API + HTTPS to public internet (for grype
    # DB download and OCI registry pulls) are allowed. All RFC 1918
    # private ranges are blocked — the scanner cannot reach internal
    # cluster services. Operators who host images in an internal
    # registry must add an allow rule here.
    additionalEgressRules: []
