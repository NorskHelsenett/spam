name: Build and Deploy

on:
  push:
    paths:
      - 'web/**'
      - 'api/**'
      - 'runner/**'
      - '.helm/**'
      - '.github/workflows/docker.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Buildah port — the previous workflow used docker/setup-buildx-action +
# docker/build-push-action, which needs a reachable Docker daemon. Our
# self-hosted Fedora runner runs Podman and doesn't expose /var/run/docker.sock
# to the runner process, so every job was dying at "Set up Docker Buildx".
# redhat-actions/buildah-build talks to buildah directly — no daemon, no
# socket, nothing privileged. Multi-stage builds + RUN --mount=type=cache
# from the Dockerfiles still work unchanged; buildah uses its local
# containers/storage for layer cache (persistent on self-hosted runners).

jobs:
  build-app:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      repository: ${{ steps.export-vars.outputs.repository }}
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Derive registry host
        # Extract plain host (strip scheme) from server URL and export to environment.
        # ghcr.io for GitHub.com, otherwise the server host (Gitea, etc).
        run: |
          set -e
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          if [ "$host" = "github.com" ]; then
            echo "REGISTRY_HOST=ghcr.io" >> "$GITHUB_ENV"
          else
            echo "REGISTRY_HOST=$host" >> "$GITHUB_ENV"
          fi
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPOSITORY_LOWER=$repo_lower" >> "$GITHUB_ENV"

      - name: Docker Metadata action
        uses: docker/metadata-action@v4.3.0
        id: meta
        with:
          images: ${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}
          tags: |
              type=ref,event=branch
              type=raw,value={{date 'YYYY.MM.DD.HHmm' tz='UTC'}}
              type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
              type=raw,value=dev,enable=${{ github.ref != format('refs/heads/{0}', 'main') }}

      - name: Derive bare tags for buildah
        # metadata-action emits fully-qualified image:tag strings. buildah-build
        # wants just the tag portion (image name is passed separately), so
        # strip the registry+repo prefix and collapse to a space-separated list.
        id: bare-tags
        run: |
          bare=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | awk -F':' '{print $NF}' | tr '\n' ' ')
          echo "tags=$bare" >> "$GITHUB_OUTPUT"

      - name: Get git commit timestamp for reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Export repository info for outputs
        id: export-vars
        run: |
          echo "repository=${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}" >> "$GITHUB_OUTPUT"

      - name: Log in to container registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ env.REGISTRY_ACCESS_TOKEN }}

      - name: Build image with Buildah
        uses: redhat-actions/buildah-build@v2
        id: build
        with:
          image: ${{ env.REPOSITORY_LOWER }}
          tags: ${{ steps.bare-tags.outputs.tags }}
          context: .
          containerfiles: |
            ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          extra-args: |
            --layers

      - name: Push to container registry
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          image: ${{ env.REPOSITORY_LOWER }}
          tags: ${{ steps.bare-tags.outputs.tags }}
          registry: ${{ env.REGISTRY_HOST }}

  build-runner:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      repository: ${{ steps.export-vars.outputs.repository }}
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Derive registry host
        run: |
          set -e
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          if [ "$host" = "github.com" ]; then
            echo "REGISTRY_HOST=ghcr.io" >> "$GITHUB_ENV"
          else
            echo "REGISTRY_HOST=$host" >> "$GITHUB_ENV"
          fi
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPOSITORY_LOWER=$repo_lower" >> "$GITHUB_ENV"

      - name: Docker Metadata action for runner
        uses: docker/metadata-action@v4.3.0
        id: meta
        with:
          images: ${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}/runner
          tags: |
              type=ref,event=branch
              type=raw,value={{date 'YYYY.MM.DD.HHmm' tz='UTC'}}
              type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
              type=raw,value=dev,enable=${{ github.ref != format('refs/heads/{0}', 'main') }}

      - name: Derive bare tags for buildah
        id: bare-tags
        run: |
          bare=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | awk -F':' '{print $NF}' | tr '\n' ' ')
          echo "tags=$bare" >> "$GITHUB_OUTPUT"

      - name: Get git commit timestamp for reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Export repository info for outputs
        id: export-vars
        run: |
          echo "repository=${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}/runner" >> "$GITHUB_OUTPUT"

      - name: Log in to container registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ env.REGISTRY_ACCESS_TOKEN }}

      - name: Build runner image with Buildah
        uses: redhat-actions/buildah-build@v2
        id: build
        with:
          image: ${{ env.REPOSITORY_LOWER }}/runner
          tags: ${{ steps.bare-tags.outputs.tags }}
          context: ./runner
          containerfiles: |
            ./runner/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          extra-args: |
            --layers

      - name: Push runner to container registry
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          image: ${{ env.REPOSITORY_LOWER }}/runner
          tags: ${{ steps.bare-tags.outputs.tags }}
          registry: ${{ env.REGISTRY_HOST }}

  build-sbom-scanner:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      repository: ${{ steps.export-vars.outputs.repository }}
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Derive registry host
        run: |
          set -e
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          if [ "$host" = "github.com" ]; then
            echo "REGISTRY_HOST=ghcr.io" >> "$GITHUB_ENV"
          else
            echo "REGISTRY_HOST=$host" >> "$GITHUB_ENV"
          fi
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPOSITORY_LOWER=$repo_lower" >> "$GITHUB_ENV"

      - name: Docker Metadata action for sbom-scanner
        uses: docker/metadata-action@v4.3.0
        id: meta
        with:
          images: ${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}/sbom-scanner
          tags: |
              type=ref,event=branch
              type=raw,value={{date 'YYYY.MM.DD.HHmm' tz='UTC'}}
              type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
              type=raw,value=dev,enable=${{ github.ref != format('refs/heads/{0}', 'main') }}

      - name: Derive bare tags for buildah
        id: bare-tags
        run: |
          bare=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | awk -F':' '{print $NF}' | tr '\n' ' ')
          echo "tags=$bare" >> "$GITHUB_OUTPUT"

      - name: Get git commit timestamp for reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Export repository info for outputs
        id: export-vars
        run: |
          echo "repository=${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}/sbom-scanner" >> "$GITHUB_OUTPUT"

      - name: Log in to container registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ env.REGISTRY_ACCESS_TOKEN }}

      - name: Build sbom-scanner image with Buildah
        uses: redhat-actions/buildah-build@v2
        id: build
        with:
          image: ${{ env.REPOSITORY_LOWER }}/sbom-scanner
          tags: ${{ steps.bare-tags.outputs.tags }}
          context: ./runner
          containerfiles: |
            ./runner/Dockerfile.sbom-scanner
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          extra-args: |
            --layers

      - name: Push sbom-scanner to container registry
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          image: ${{ env.REPOSITORY_LOWER }}/sbom-scanner
          tags: ${{ steps.bare-tags.outputs.tags }}
          registry: ${{ env.REGISTRY_HOST }}

  build-image-scanner:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      repository: ${{ steps.export-vars.outputs.repository }}
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Derive registry host
        run: |
          set -e
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          if [ "$host" = "github.com" ]; then
            echo "REGISTRY_HOST=ghcr.io" >> "$GITHUB_ENV"
          else
            echo "REGISTRY_HOST=$host" >> "$GITHUB_ENV"
          fi
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPOSITORY_LOWER=$repo_lower" >> "$GITHUB_ENV"

      - name: Docker Metadata action for image-scanner
        uses: docker/metadata-action@v4.3.0
        id: meta
        with:
          images: ${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}/image-scanner
          tags: |
              type=ref,event=branch
              type=raw,value={{date 'YYYY.MM.DD.HHmm' tz='UTC'}}
              type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
              type=raw,value=dev,enable=${{ github.ref != format('refs/heads/{0}', 'main') }}

      - name: Derive bare tags for buildah
        id: bare-tags
        run: |
          bare=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | awk -F':' '{print $NF}' | tr '\n' ' ')
          echo "tags=$bare" >> "$GITHUB_OUTPUT"

      - name: Get git commit timestamp for reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Export repository info for outputs
        id: export-vars
        run: |
          echo "repository=${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}/image-scanner" >> "$GITHUB_OUTPUT"

      - name: Log in to container registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ env.REGISTRY_ACCESS_TOKEN }}

      - name: Build image-scanner image with Buildah
        uses: redhat-actions/buildah-build@v2
        id: build
        with:
          image: ${{ env.REPOSITORY_LOWER }}/image-scanner
          tags: ${{ steps.bare-tags.outputs.tags }}
          context: ./runner
          containerfiles: |
            ./runner/Dockerfile.image-scanner
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          extra-args: |
            --layers

      - name: Push image-scanner to container registry
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          image: ${{ env.REPOSITORY_LOWER }}/image-scanner
          tags: ${{ steps.bare-tags.outputs.tags }}
          registry: ${{ env.REGISTRY_HOST }}

  deploy-helm:
    runs-on: ubuntu-latest
    needs: [build-app, build-runner, build-sbom-scanner, build-image-scanner]
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Derive registry host
        run: |
          set -e
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          if [ "$host" = "github.com" ]; then
            echo "REGISTRY_HOST=ghcr.io" >> "$GITHUB_ENV"
          else
            echo "REGISTRY_HOST=$host" >> "$GITHUB_ENV"
          fi
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPOSITORY_LOWER=$repo_lower" >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Login to OCI Registry for Helm
        run: |
          echo "${{ env.REGISTRY_ACCESS_TOKEN }}" | helm registry login ${{ env.REGISTRY_HOST }} -u "${{ github.actor }}" --password-stdin

      - name: Push Helm chart
        run: |
          # Query the latest published chart to derive current version (ignore errors if first publish)
          set -euo pipefail
          repo_path=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          chart_name=$(awk -F': ' '/^name:/ {print $2; exit}' .helm/Chart.yaml)

          # Use different chart path for dev branches
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            chart_repo="oci://${{ env.REGISTRY_HOST }}/$repo_path"
          else
            chart_repo="oci://${{ env.REGISTRY_HOST }}/$repo_path/helm/dev"
          fi
          chart_ref="${chart_repo}/${chart_name}"

          # Get version from Chart.yaml
          CHART_YAML_VERSION=$(awk -F': ' '/^version:/ {print $2; exit}' .helm/Chart.yaml | tr -d ' ')

          tmp_chart_metadata=$(mktemp)
          if helm show chart "$chart_ref" > "$tmp_chart_metadata" 2>/dev/null; then
            PUBLISHED_VERSION=$(awk -F': ' '/^version:/ {print $2; exit}' "$tmp_chart_metadata" | tr -d ' ')
          else
            echo "No existing chart found for $chart_ref, starting at 0.0.0"
            PUBLISHED_VERSION="0.0.0"
          fi
          rm -f "$tmp_chart_metadata"

          # Function to compare semantic versions
          version_gt() {
            test "$(printf '%s\n' "$@" | sort -V | head -n 1)" != "$1"
          }

          # Determine which version to use
          if version_gt "$CHART_YAML_VERSION" "$PUBLISHED_VERSION"; then
            NEW_VERSION="$CHART_YAML_VERSION"
            echo "Using Chart.yaml version $NEW_VERSION (higher than published $PUBLISHED_VERSION)"
          else
            # Increment published version
            IFS='.' read -r major minor patch <<< "$PUBLISHED_VERSION"
            NEW_VERSION="$major.$minor.$((patch+1))"
            echo "Bumping chart version: $PUBLISHED_VERSION -> $NEW_VERSION"
            # Update version line in Chart.yaml
            sed -i -E "s/^version: .*/version: $NEW_VERSION/" .helm/Chart.yaml
          fi

          echo "Final version: $NEW_VERSION"

          # Choose the tag prefix based on the branch the build ran on.
          # metadata-action publishes the images as :latest on main and
          # :dev elsewhere, so the chart needs to reference the matching
          # tag. The digest pin is authoritative either way, but naming
          # the correct tag means Kubernetes can fall back cleanly if the
          # digest is later GC'd from the registry.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            IMAGE_TAG="latest"
          else
            IMAGE_TAG="dev"
          fi
          echo "Using image tag prefix: $IMAGE_TAG"

          # Inject image repository and digest
          APP_DIGEST=${{ needs.build-app.outputs.digest }}
          APP_TAG="${IMAGE_TAG}@${APP_DIGEST}"
          APP_REPO="${{ needs.build-app.outputs.repository }}"
          RUNNER_DIGEST=${{ needs.build-runner.outputs.digest }}
          RUNNER_TAG="${IMAGE_TAG}@${RUNNER_DIGEST}"
          RUNNER_REPO="${{ needs.build-runner.outputs.repository }}"
          SBOM_SCANNER_DIGEST=${{ needs.build-sbom-scanner.outputs.digest }}
          SBOM_SCANNER_TAG="${IMAGE_TAG}@${SBOM_SCANNER_DIGEST}"
          SBOM_SCANNER_REPO="${{ needs.build-sbom-scanner.outputs.repository }}"
          IMAGE_SCANNER_DIGEST=${{ needs.build-image-scanner.outputs.digest }}
          IMAGE_SCANNER_TAG="${IMAGE_TAG}@${IMAGE_SCANNER_DIGEST}"
          IMAGE_SCANNER_REPO="${{ needs.build-image-scanner.outputs.repository }}"

          echo "Injecting app repository: $APP_REPO"
          echo "Injecting app tag with digest: $APP_TAG"
          echo "Injecting runner repository: $RUNNER_REPO"
          echo "Injecting runner tag with digest: $RUNNER_TAG"
          echo "Injecting sbom-scanner repository: $SBOM_SCANNER_REPO"
          echo "Injecting sbom-scanner tag with digest: $SBOM_SCANNER_TAG"
          echo "Injecting image-scanner repository: $IMAGE_SCANNER_REPO"
          echo "Injecting image-scanner tag with digest: $IMAGE_SCANNER_TAG"

          python3 - <<EOF
          import pathlib

          app_tag = "${APP_TAG}"
          app_repo = "${APP_REPO}"
          runner_tag = "${RUNNER_TAG}"
          runner_repo = "${RUNNER_REPO}"
          sbom_scanner_tag = "${SBOM_SCANNER_TAG}"
          sbom_scanner_repo = "${SBOM_SCANNER_REPO}"
          image_scanner_tag = "${IMAGE_SCANNER_TAG}"
          image_scanner_repo = "${IMAGE_SCANNER_REPO}"
          path = pathlib.Path(".helm/values.yaml")
          lines = path.read_text().splitlines()

          in_image_section = False
          in_runner_section = False
          in_runner_image_section = False
          in_sbom_scanner_section = False
          in_sbom_scanner_image_section = False
          in_image_scanner_section = False
          in_image_scanner_image_section = False
          for idx, line in enumerate(lines):
              stripped = line.lstrip()

              # Detect if we're in the TOP-LEVEL image section (no indentation before "image:")
              if line.startswith("image:") and not line.startswith((" ", "\t")):
                  in_image_section = True
                  in_runner_section = False
                  in_runner_image_section = False
                  in_sbom_scanner_section = False
                  in_sbom_scanner_image_section = False
                  in_image_scanner_section = False
                  in_image_scanner_image_section = False
                  continue

              # Detect if we're in the runner section
              if line.startswith("runner:") and not line.startswith((" ", "\t")):
                  in_runner_section = True
                  in_image_section = False
                  in_sbom_scanner_section = False
                  in_sbom_scanner_image_section = False
                  in_image_scanner_section = False
                  in_image_scanner_image_section = False
                  continue

              # Detect if we're in the sbomScanner section
              if line.startswith("sbomScanner:") and not line.startswith((" ", "\t")):
                  in_sbom_scanner_section = True
                  in_image_section = False
                  in_runner_section = False
                  in_runner_image_section = False
                  in_image_scanner_section = False
                  in_image_scanner_image_section = False
                  continue

              # Detect if we're in the imageScanner section
              if line.startswith("imageScanner:") and not line.startswith((" ", "\t")):
                  in_image_scanner_section = True
                  in_image_section = False
                  in_runner_section = False
                  in_runner_image_section = False
                  in_sbom_scanner_section = False
                  in_sbom_scanner_image_section = False
                  continue

              # Detect runner.image subsection
              if in_runner_section and stripped.startswith("image:") and line.startswith(" "):
                  in_runner_image_section = True
                  continue

              # Detect sbomScanner.image subsection
              if in_sbom_scanner_section and stripped.startswith("image:") and line.startswith(" "):
                  in_sbom_scanner_image_section = True
                  continue

              # Detect imageScanner.image subsection
              if in_image_scanner_section and stripped.startswith("image:") and line.startswith(" "):
                  in_image_scanner_image_section = True
                  continue

              # Exit image section when we hit another top-level key
              if in_image_section and stripped and not line.startswith((" ", "\t")):
                  in_image_section = False

              # Exit runner section when we hit another top-level key
              if in_runner_section and stripped and not line.startswith((" ", "\t")):
                  in_runner_section = False
                  in_runner_image_section = False

              # Exit sbomScanner section when we hit another top-level key
              if in_sbom_scanner_section and stripped and not line.startswith((" ", "\t")):
                  in_sbom_scanner_section = False
                  in_sbom_scanner_image_section = False

              # Exit imageScanner section when we hit another top-level key
              if in_image_scanner_section and stripped and not line.startswith((" ", "\t")):
                  in_image_scanner_section = False
                  in_image_scanner_image_section = False

              # Exit runner.image section when indentation decreases
              if in_runner_image_section and stripped and len(line) - len(stripped) < 4:
                  in_runner_image_section = False

              # Exit sbomScanner.image section when indentation decreases
              if in_sbom_scanner_image_section and stripped and len(line) - len(stripped) < 4:
                  in_sbom_scanner_image_section = False

              # Exit imageScanner.image section when indentation decreases
              if in_image_scanner_image_section and stripped and len(line) - len(stripped) < 4:
                  in_image_scanner_image_section = False

              # Update repository and tag within top-level image section
              if in_image_section:
                  if stripped.startswith("repository:"):
                      indent = line[:len(line) - len(stripped)]
                      lines[idx] = f'{indent}repository: {app_repo}'
                  elif stripped.startswith("tag:"):
                      indent = line[:len(line) - len(stripped)]
                      lines[idx] = f'{indent}tag: "{app_tag}"'

              # Update repository and tag within runner.image section
              if in_runner_image_section:
                  if stripped.startswith("repository:"):
                      indent = line[:len(line) - len(stripped)]
                      lines[idx] = f'{indent}repository: {runner_repo}'
                  elif stripped.startswith("tag:"):
                      indent = line[:len(line) - len(stripped)]
                      lines[idx] = f'{indent}tag: "{runner_tag}"'

              # Update repository and tag within sbomScanner.image section
              if in_sbom_scanner_image_section:
                  if stripped.startswith("repository:"):
                      indent = line[:len(line) - len(stripped)]
                      lines[idx] = f'{indent}repository: {sbom_scanner_repo}'
                  elif stripped.startswith("tag:"):
                      indent = line[:len(line) - len(stripped)]
                      lines[idx] = f'{indent}tag: "{sbom_scanner_tag}"'

              # Update repository and tag within imageScanner.image section
              if in_image_scanner_image_section:
                  if stripped.startswith("repository:"):
                      indent = line[:len(line) - len(stripped)]
                      lines[idx] = f'{indent}repository: {image_scanner_repo}'
                  elif stripped.startswith("tag:"):
                      indent = line[:len(line) - len(stripped)]
                      lines[idx] = f'{indent}tag: "{image_scanner_tag}"'

          path.write_text("\n".join(lines) + ("\n" if lines else ""))
          EOF

          # Add required Helm repositories for dependencies
          echo "Adding Helm repositories..."
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

          # Package and push (already logged in earlier step)
          (cd .helm && helm dependency build && helm package .)
          helm push ".helm/${chart_name}-${NEW_VERSION}.tgz" "$chart_repo"
