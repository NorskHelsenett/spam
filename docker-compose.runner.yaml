version: "3.8"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: spam
      POSTGRES_PASSWORD: spam
      POSTGRES_DB: spam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spam"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["/app/worker"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: spam
      POSTGRES_PASSWORD: spam
      POSTGRES_DB: spam
      POSTGRES_SSLMODE: disable
      WORKER_CONCURRENCY: "4"
      RUNNER_ENABLED: "true"
      RUNNER_LOCAL_MODE: "true"
      RUNNER_HMAC_KEY: "test-hmac-key-at-least-32-bytes-long-for-security"
      RUNNER_IMAGE: spam-runner:local
      RUNNER_NAMESPACE: local
      RUNNER_SERVICE_ACCOUNT: local
      RUNNER_WORKER_URL: "http://worker:8081"
      RUNNER_HTTP_PORT: "8081"
      RUNNER_TTL_SECONDS: "3600"
      RUNNER_ACTIVE_DEADLINE: "1800"
    ports:
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  # Runner container - only used with 'docker-compose --profile test run runner'
  runner:
    build:
      context: ./runner
    profiles: ["test"]
    environment:
      WORKER_URL: "http://worker:8081"
      RUN_ID: "test-run-${RUN_ID:-local}"
      RUN_TOKEN: "dummy"
      REPO_CLONE_URL: "${REPO_CLONE_URL:-https://github.com/jonasbg/picoblog.git}"
      REPO_REF: "${REPO_REF:-}"
    depends_on:
      - worker
    networks:
      - default

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
